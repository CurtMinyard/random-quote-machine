<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Quote Machine</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="quote-box" class="quote-box">
    <div id="text" class="quote-text"></div>
    <div id="author" class="quote-author"></div>
    <button id="new-quote" class="new-quote-button">New Quote</button>
    <a id="tweet-quote" href="https://twitter.com/intent/tweet" target="_top" class="tweet-quote-button">Tweet Quote</a>
  </div>
  <script src="https://cdn.freecodecamp.org/testable-projects-fcc/v1/bundle.js"></script>
  <script src="script.js"></script>
</body>
</html>
